services:

  mysql:
    image: mysql:8.0
    container_name: pda-mysql
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
      - MYSQL_ROOT_PASSWORD=juanp
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante la inicialización (init.sql) MySQL
      # levanta un servidor temporal SIN red; con "localhost" (socket) el
      # healthcheck daría "healthy" antes de tiempo y tienda-service
      # arrancaría antes de que existan las cuentas.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pjuanp"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: pda-rabbitmq
    restart: unless-stopped
    environment:
      - TZ=America/Bogota
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  pda:
    build:
      context: ./PDA
    container_name: pda-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=juanp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      - MAIL_PASSWORD=${MAIL_PASSWORD}
    ports:
      - "8080:8080"
    volumes:
      - ./PDA/uploads/fotos:/app/uploads/fotos

  tienda-service:
    build:
      context: ./tienda-service
    container_name: tienda-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=juanp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
      # Comisión de la liquidación Tienda -> Refugio (%). Editable sin tocar código.
      - TRANSFERENCIA_COMISION_PORCENTAJE=${TRANSFERENCIA_COMISION_PORCENTAJE:-5.0}
    ports:
      - "8081:8081"

  proveedor-service:
    build:
      context: ./proveedor-service
    container_name: proveedor-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      - TZ=America/Bogota
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=juanp
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=guest
      - RABBITMQ_PASSWORD=guest
    ports:
      - "8082:8082"

volumes:
  mysql_data: