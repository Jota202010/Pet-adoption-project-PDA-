spring.application.name=proyecto_de_aula

# Base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/empresa?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=8080
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Fotos subidas — carpeta externa (servida por WebConfig en /fotos/**)
app.upload.dir=uploads/fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
