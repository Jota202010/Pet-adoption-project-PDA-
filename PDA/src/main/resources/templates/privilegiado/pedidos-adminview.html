<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
                xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8"/>
  <title>Pedidos — Refugio Nueva Vida</title>
  <link rel="stylesheet" th:href="@{/css/detalle-perro-adminview.css}"/>
  <link rel="stylesheet" th:href="@{/css/barras.css}"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
</head>
<body>
  <nav>
    <div class="nav-left">
      <a th:href="@{/inicio}" class="nav-brand">Refugio Nueva Vida</a>
      <span class="admin-badge">⚙ Panel Admin</span>
    </div>
    <div class="nav-right">
      <a th:href="@{/admin/notificaciones}" class="btn-campana"
         sec:authorize="hasRole('administrador')"
         th:classappend="${totalNoLeidas != null and totalNoLeidas > 0} ? ' tiene-no-leidas' : ''">
        🔔
        <span th:if="${totalNoLeidas != null and totalNoLeidas > 0}"
              class="badge-no-leidas" th:text="${totalNoLeidas}">3</span>
      </a>
      <a th:href="@{/admin/inventario}" class="btn-perfil-nav">🐾 Inventario</a>
      <a th:href="@{/admin/panel}" class="btn-exit">← Volver al panel</a>
    </div>
  </nav>

  <div class="page-wrapper" style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">

    <div th:if="${mensajeExito}"
         style="background:#D1FAE5;border:1px solid #6EE7B7;border-radius:12px;
                padding:14px 20px;margin-bottom:20px;font-weight:700;color:#065F46;
                display:flex;align-items:center;gap:10px;">
      ✅ <span th:text="${mensajeExito}"></span>
    </div>

    <div th:if="${errorMsg}"
         style="background:#FEE2E2;border:1px solid #FCA5A5;border-radius:12px;
                padding:14px 20px;margin-bottom:20px;font-weight:700;color:#991B1B;
                display:flex;align-items:center;gap:10px;">
      ⚠️ <span th:text="${errorMsg}"></span>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:25px; flex-wrap:wrap; gap:12px;">
      <h1 style="font-family:'Playfair Display',serif; color:#2C3E50; margin:0;">
        📦 Pedidos Recibidos
      </h1>

      <form th:if="${not #lists.isEmpty(seguimientos)}"
            th:action="@{/admin/pedidos/eliminar}"
            method="post"
            onsubmit="return confirm('¿Eliminar TODO el historial de pedidos recibidos del proveedor? Esta acción no se puede deshacer.');">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <button type="submit"
                style="padding:10px 18px; border-radius:10px; border:none;
                       background:#fee2e2; color:#991b1b;
                       font-weight:800; font-size:0.85rem; cursor:pointer;
                       font-family:inherit; transition: all 0.2s ease;">
          🗑️ Eliminar historial de pedidos
        </button>
      </form>
    </div>

    <div th:if="${#lists.isEmpty(seguimientos)}"
         style="text-align:center;padding:60px;background:#fff;border:2px dashed #e2e8f0;border-radius:20px;">
      <div style="font-size:4rem;">📭</div>
      <h3 style="color:#475569;">No hay pedidos aún</h3>
      <p style="color:#94a3b8;">Cuando el proveedor envíe algo, aparecerá aquí.</p>
    </div>

    <div th:if="${not #lists.isEmpty(seguimientos)}"
         style="display:flex; flex-direction:column; gap:15px;">

      <div th:each="s : ${seguimientos}"
           style="background:#fff; border-radius:16px; padding:22px 25px;
                  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
                  border-left: 6px solid #eab308;">

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
          <strong style="font-family:'Playfair Display',serif; color:#2C3E50; font-size:1.1rem;">
            📦 Pedido #<span th:text="${s.idPedido}">1</span>
          </strong>
          <span th:text="${#temporals.format(s.fecha, 'dd/MM/yyyy HH:mm')}"
                style="color:#94a3b8; font-size:.82rem;"></span>
        </div>

        <p style="color:#64748b; margin:8px 0;" th:text="${s.descripcion}">Descripción</p>

        <div style="margin-top:12px;">
          <span th:switch="${s.estado}"
                th:classappend="${s.estado == 'ENTREGADO' ? 'background:#dcfce7;color:#166534;' :
                                 (s.estado == 'EN_REPARTO' ? 'background:#f3e8ff;color:#6b21a8;' :
                                 (s.estado == 'EN_TRANSITO' ? 'background:#dbeafe;color:#1e40af;' :
                                 (s.estado == 'DESPACHADO' ? 'background:#fed7aa;color:#9a3412;' :
                                 'background:#fef9c3;color:#854d0e;')))}"
                style="display:inline-block; padding:6px 14px; border-radius:999px;
                       font-size:.78rem; font-weight:800;">
            <span th:case="'PREPARANDO'">📝 PREPARANDO</span>
            <span th:case="'DESPACHADO'">📤 DESPACHADO</span>
            <span th:case="'EN_TRANSITO'">🚛 EN TRÁNSITO</span>
            <span th:case="'EN_REPARTO'">🛵 EN REPARTO</span>
            <span th:case="'ENTREGADO'">✅ ENTREGADO</span>
            <span th:case="*" th:text="${s.estado}">ESTADO</span>
          </span>
        </div>

      </div>
    </div>
  </div>

  <footer style="text-align:center;padding:30px;color:#94a3b8;">
    <p>© 2025 Refugio Nueva Vida</p>
  </footer>

</body>
</html>
