<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<!-- Fragmento reutilizable: HEADER -->
<header th:fragment="header" class="main-header">

    <div class="header-left">
        <a th:href="@{/inicio}" class="brand">
            🐾 <span>Refugio Nueva Vida</span>
        </a>
    </div>

    <nav class="header-nav">
        <a th:href="@{/inicio}">Inicio</a>
        <a th:href="@{/nosotros}">Nosotros</a>
        <a th:href="@{/mision}">Misión</a>
        <a th:href="@{/perfil}" sec:authorize="isAuthenticated()">👤 Mi Perfil</a>
        <a th:href="@{/admin/panel}"
           sec:authorize="hasRole('administrador')"
           class="btn-admin-nav">⚙️ Admin</a>
    </nav>

    <div class="header-right">

        <!-- 🔔 CAMPANA DE NOTIFICACIONES (solo admin) -->
        <a th:href="@{/admin/notificaciones}"
           class="btn-campana"
           sec:authorize="hasRole('administrador')"
           th:classappend="${totalNoLeidas != null and totalNoLeidas > 0} ? ' tiene-no-leidas' : ''"
           title="Notificaciones y recetas">
            🔔
            <span th:if="${totalNoLeidas != null and totalNoLeidas > 0}"
                  class="badge-no-leidas"
                  th:text="${totalNoLeidas}">3</span>
        </a>

        <!-- Login / Logout -->
        <form th:action="@{/logout}" method="post" style="display:inline;"
              sec:authorize="isAuthenticated()">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn-nav">Cerrar Sesión</button>
        </form>
        <a th:href="@{/login}" class="btn-nav" sec:authorize="!isAuthenticated()">Iniciar Sesión</a>
    </div>

</header>

</body>
</html>
