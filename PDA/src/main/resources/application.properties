spring.application.name=proyecto_de_aula

# =========================================================
#  SESIÓN (evita que pida iniciar sesión seguido)
# =========================================================
# Tiempo de inactividad antes de que expire la sesión (por defecto Spring usa 30m)
server.servlet.session.timeout=8h
# Duración de la cookie "Recuérdame" cuando el usuario marca la casilla en login
refugio.seguridad.remember-me.duracion-segundos=1209600

# =========================================================
# BASE DE DATOS MYSQL
# =========================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/empresa?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:juanp}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# =========================================================
# THYMELEAF
# =========================================================
spring.thymeleaf.cache=false

# =========================================================
# FOTOS SUBIDAS
# =========================================================
app.upload.dir=uploads/fotos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

# Manejo de errores — permite capturar 404 en GlobalExceptionHandler
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# =========================================================
# RABBITMQ
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=/

# =========================================================
# EMAIL
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:juanrogers1809@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================
#  BARRAS DE VIDA
# =========================================================
refugio.barras.nutricion.decaimiento-horas=12
refugio.barras.nutricion.decaimiento-porcentaje=2

refugio.barras.hidratacion.decaimiento-horas=8
refugio.barras.hidratacion.decaimiento-porcentaje=3

refugio.barras.salud.decaimiento-dias=7
refugio.barras.salud.decaimiento-porcentaje=1

refugio.barras.energia.decaimiento-horas=6
refugio.barras.energia.decaimiento-porcentaje=4

# =========================================================
#  RECETAS (umbrales para generar)
# =========================================================
refugio.recetas.umbral-nutricion=50
refugio.recetas.umbral-hidratacion=40
refugio.recetas.umbral-salud=60

# =========================================================
#  MODO DEMO
# =========================================================
refugio.demo.acelerar-tiempo=false
refugio.demo.factor-aceleracion=100
